version: "2"

run:
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    # Error Handling
    - errcheck       # Unchecked errors
    - errorlint      # Error wrapping issues
    - errname        # Error naming conventions
    
    # Code Quality
    - govet          # Official Go analysis
    - staticcheck    # Comprehensive static analysis
    - unused         # Unused code
    - ineffassign    # Ineffectual assignments
    - unconvert      # Unnecessary conversions
    - unparam        # Unused parameters
    
    # Bugs & Correctness
    - copyloopvar    # Loop variable capturing
    - nilnil         # Prevent (nil, nil) returns
    - nilerr         # Check nil errors
    
    # Complexity
    - gocyclo        # Cyclomatic complexity
    - funlen         # Function length
    - nestif         # Nested if depth
    
    # Code Smells
    - goconst        # Repeated strings → constants
    - dupl           # Code duplication
    - gocritic       # Comprehensive linting
    - revive         # Fast, configurable linter
    
    # Security
    - gosec          # Security issues
    
    # HTTP/Network
    - bodyclose      # HTTP response body closure
    - noctx          # HTTP requests without context
    
    # Style & Readability
    - whitespace     # Whitespace issues
    - predeclared    # Shadows of predeclared identifiers
    
    # Documentation & Naming
    - misspell       # Spelling mistakes
    - godot          # Comment punctuation
    
    # Linter Usage
    - nolintlint     # Proper nolint usage

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    
    funlen:
      lines: -1
      statements: 50
    
    goconst:
      min-len: 3
      min-occurrences: 3
    
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
    
    gocyclo:
      min-complexity: 15
    
    gosec:
      excludes:
        - G404
    
    govet:
      enable:
        - nilness
        - shadow
    
    nestif:
      min-complexity: 6
    
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    
    misspell:
      locale: US
    
    revive:
      confidence: 0.8
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: function-length
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: file-header
          disabled: true

  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: (.+)_test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - gosec
      - path: main\.go$
        linters:
          - gosec
        text: 'G304: Potential file inclusion via variable'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
